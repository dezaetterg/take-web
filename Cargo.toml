[package]
name = "takeweb"
version = "0.1.0"
edition = "2021"
authors = ["dezaetterg <dezaetterg@users.noreply.github.com>"]
description = "Fast, privacy-focused open-source web browser for Linux"
license = "GPL-3.0-or-later"
repository = "https://github.com/dezaetterg/take-web"
homepage = "https://github.com/dezaetterg/take-web"
readme = "README.md"
keywords = ["browser", "gtk4", "libadwaita", "webkitgtk", "privacy"]
categories = ["gui", "network-programming"]

[dependencies]
# UI Framework
gtk4 = { version = "0.11", features = ["v4_12"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
webkit6 = { version = "0.6", features = ["v2_52"] }
soup3 = "0.9"

# System & Async
gio = "0.22"
glib = "0.22"
tokio = { version = "1", features = ["rt", "sync", "macros"] }

# Data & Persistence
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
url = "2.5"
once_cell = "1.19"
log = "0.4"
env_logger = "0.11"
mpris-server = { version = "0.11", features = ["tokio"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
